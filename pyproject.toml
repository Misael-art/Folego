[project]
name = "folego"
version = "0.1.0"
description = "Reversible RAM/CPU wellness tuner for the Steam Deck (BigLinux/KDE)"
requires-python = ">=3.14,<3.15"
# CLI independente de Qt; o wrapper instala a GUI em ambiente próprio.
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest", "hypothesis"]

[project.scripts]
folego = "folego.cli:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
