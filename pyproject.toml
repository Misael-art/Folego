[project]
name = "folego"
version = "0.1.0"
description = "Reversible RAM/CPU wellness tuner for the Steam Deck (BigLinux/KDE)"
requires-python = ">=3.14"
# PySide6 is provided by the system python; the venv uses --system-site-packages.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "hypothesis"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
