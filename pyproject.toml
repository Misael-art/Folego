[project]
name = "folego"
version = "0.2.0b10"
description = "Resource diagnostics and reversible manual actions for Linux and KDE Plasma"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["linux", "kde", "resource-monitor", "tmpfs", "pyside6"]
requires-python = ">=3.14,<3.15"
# CLI independente de Qt; o wrapper instala a GUI em ambiente próprio.
dependencies = []

[project.urls]
Repository = "https://github.com/Misael-art/Folego"
Issues = "https://github.com/Misael-art/Folego/issues"

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest", "hypothesis"]

[project.scripts]
folego = "folego.cli:main"
folego-agent-hook = "folego.agent_hook:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
folego = ["ui/icons/*.svg", "ui/icons/LICENSE", "ui/icons/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
