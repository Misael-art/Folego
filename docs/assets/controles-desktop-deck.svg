<text x="44" y="987" font-size="18" fill="#243848" font-weight="400">Steam + A / Y</text>
<text x="460" y="987" font-size="18" fill="#243848" font-weight="400">Alternar gravação / marcar momento¹</text>
<text x="900" y="987" font-size="18" fill="#243848" font-weight="400">Colar / capturar tela</text>
