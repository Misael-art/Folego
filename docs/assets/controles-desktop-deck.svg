<text x="900" y="1311" font-size="18" fill="#243848" font-weight="400">—</text>
<text x="42" y="1360" font-size="18" fill="#243848" font-weight="400">¹ Disponibilidade depende do sistema, do cliente e da gravação. O SteamOS e o BigLinux podem diferir.</text>
<text x="42" y="1389" font-size="18" fill="#243848" font-weight="400">— indica combinação sem ação específica no perfil PhaseZero. Perfis por jogo ou aplicativo podem mudar os atalhos.</text>
<text x="42" y="1418" font-size="17" fill="#243848" font-weight="400">Fontes: mapas desktop_neptune e chord_neptune da Valve · perfil PhaseZero-Desktop 1.22.16 · 25/11/2026.</text></g></svg>
