<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 1443" width="1350" height="1443" role="img" aria-labelledby="titulo"><title id="titulo">Comparação dos controles no desktop do Steam Deck</title><rect width="1350" height="1443" fill="white"/><g font-family="DejaVu Sans,sans-serif"><text x="40" y="67" font-size="44" fill="#132e45" font-weight="700">Steam Deck no KDE</text>
<text x="42" y="105" font-size="23" fill="#243848" font-weight="400">Compare o mesmo botão nos dois perfis de desktop.</text>
<text x="42" y="142" font-size="19" fill="#243848" font-weight="400">Steam fica abaixo do trackpad esquerdo. O botão de três pontos (…) fica abaixo do direito.</text>
